name: Build and Release DubStudio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to build (e.g. 1.1.3)'
        required: true
        default: '1.1.3'
      tag_name:
        description: 'Release tag name (e.g. v1.1.3)'
        required: true
        default: 'v1.1.3'

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version and Tag
        id: vars
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ver = '${{ github.event.inputs.version }}'
            $tag = '${{ github.event.inputs.tag_name }}'
          } else {
            $tag = '${{ github.ref_name }}'
            $ver = $tag.TrimStart('v')
          }
          Write-Host "Building DubStudio Version: $ver (Tag: $tag)"
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV

      - name: Install Python Build Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 fastapi uvicorn requests soundfile numpy pydantic pydantic-settings typer rich python-dotenv httpx tqdm psutil nvidia-ml-py

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk

      - name: Download & Extract FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          Write-Host "Downloading GyanD FFmpeg essentials build..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item -Path $ffmpegExe -Destination "bin\ffmpeg.exe" -Force
          Copy-Item -Path $ffprobeExe -Destination "bin\ffprobe.exe" -Force
          Remove-Item -Path "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "FFmpeg successfully placed in bin/"

      - name: Clean Conflicting Remote Release Before Download
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
            "User-Agent" = "GitHub-Actions-Velopack"
          }
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
            foreach ($rel in $releases) {
              if ($rel.tag_name -eq $tag) {
                Write-Host "Found existing release for $tag (ID: $($rel.id)). Deleting so vpk download anchors cleanly to previous release..."
                Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($rel.id)" -Headers $headers
              }
            }
          } catch {
            Write-Host "Pre-download cleanup notice: $_"
          }

      - name: Download Previous Release for Delta Generation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\releases" -Force | Out-Null
          try {
            Write-Host "Attempting to download latest release packages from GitHub..."
            vpk download github --outputDir "dist\releases" --channel "win" --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
            Write-Host "Previous release packages downloaded successfully."
          } catch {
            Write-Host "No previous release found or download skipped. Building fresh release."
          }
          # Ensure current version packages are removed so vpk pack generates fresh packages without collision
          Get-ChildItem -Path "dist\releases" -Filter "*$env:VERSION*" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Build Application with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name DubStudio `
            --icon "dubstudio.ico" `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module triton `
            --exclude-module onnxruntime `
            --exclude-module ctranslate2 `
            --exclude-module nvidia `
            --exclude-module scipy `
            --exclude-module numba `
            --exclude-module llvmlite `
            --exclude-module matplotlib `
            --exclude-module sympy `
            --exclude-module mpmath `
            --exclude-module sklearn `
            --exclude-module pandas `
            --exclude-module dask `
            --exclude-module cupy `
            --exclude-module tzdata `
            --add-data "ui;ui" `
            --add-data "dubstudio;dubstudio" `
            --add-data "config;config" `
            "start_app.py"

          # Remove tzdata if present to prevent Windows symlink packaging failures
          if (Test-Path "dist\DubStudio\_internal\tzdata") {
            Remove-Item -Path "dist\DubStudio\_internal\tzdata" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Copy bin (ffmpeg, ffprobe) to dist/DubStudio/bin
          if (Test-Path "bin") {
            Copy-Item -Path "bin" -Destination "dist\DubStudio\bin" -Recurse -Force
          }
          if (Test-Path "dubstudio.ico") {
            Copy-Item -Path "dubstudio.ico" -Destination "dist\DubStudio\dubstudio.ico" -Force
            Copy-Item -Path "dubstudio.ico" -Destination "dist\DubStudio\app.ico" -Force
          }

      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId DubStudio `
            --packVersion "$env:VERSION" `
            --packTitle "DubStudio" `
            --packAuthors "DubStudio Team" `
            --packDir "dist\DubStudio" `
            --mainExe "DubStudio.exe" `
            --icon "dubstudio.ico" `
            --channel "win" `
            --noPortable `
            --outputDir "dist\releases"

      - name: Verify Delta Package and Audit Artifacts
        shell: pwsh
        run: |
          $ver = "$env:VERSION"
          $tag = "$env:TAG"
          $releasesDir = "dist\releases"
          
          $deltaPkg = Get-ChildItem -Path $releasesDir -Filter "*$ver*delta.nupkg" | Select-Object -First 1
          $fullPkg = Get-ChildItem -Path $releasesDir -Filter "*$ver*full.nupkg" | Select-Object -First 1
          $setupExe = Get-ChildItem -Path $releasesDir -Filter "*Setup.exe" | Select-Object -First 1
          
          # If not initial release (v1.0.0), delta.nupkg is MANDATORY
          if (-not $deltaPkg -and $ver -ne "1.0.0") {
            Write-Error "CRITICAL VERIFICATION FAILURE: DubStudio-$ver-delta.nupkg was NOT generated by Velopack!"
            exit 1
          }
          
          Write-Host "================ VELOPACK PACKAGE VERIFICATION ================"
          if ($deltaPkg) {
            $deltaHash = (Get-FileHash -Path $deltaPkg.FullName -Algorithm SHA256).Hash
            $deltaMB = [math]::Round($deltaPkg.Length / 1MB, 2)
            Write-Host "  -> Delta Package: $($deltaPkg.Name) ($deltaMB MB) [SHA256: $deltaHash]"
          }
          if ($fullPkg) {
            $fullHash = (Get-FileHash -Path $fullPkg.FullName -Algorithm SHA256).Hash
            $fullMB = [math]::Round($fullPkg.Length / 1MB, 2)
            Write-Host "  -> Full Package:  $($fullPkg.Name) ($fullMB MB) [SHA256: $fullHash]"
          }
          if ($setupExe) {
            $setupHash = (Get-FileHash -Path $setupExe.FullName -Algorithm SHA256).Hash
            $setupMB = [math]::Round($setupExe.Length / 1MB, 2)
            Write-Host "  -> Setup Exe:     $($setupExe.Name) ($setupMB MB) [SHA256: $setupHash]"
          }
          Write-Host "================================================================"
          
          # Export to GITHUB_STEP_SUMMARY
          "### 📦 Velopack Artifacts & Checksums (v$ver)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| File | Type | Size (MB) | SHA-256 Checksum |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|:---|:---|:---|:---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($deltaPkg) { "| `$($deltaPkg.Name)` | **Delta Patch** | $deltaMB MB | `$deltaHash` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if ($fullPkg) { "| `$($fullPkg.Name)` | **Full Package** | $fullMB MB | `$fullHash` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if ($setupExe) { "| `$($setupExe.Name)` | **Standalone Setup** | $setupMB MB | `$setupHash` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          
          # Append artifact table and audit table to RELEASE_NOTES.md
          $auditText = "`n`n### 🛡️ Bảng Kiểm toán Toàn vẹn Gói Cập nhật (Velopack Delta & Full)`n`n"
          $auditText += "| File | Loại gói | Dung lượng | Mã băm SHA-256 |`n"
          $auditText += "|:---|:---|:---|:---|`n"
          if ($deltaPkg) { $auditText += "| `$($deltaPkg.Name)` | **Bản vá Delta siêu tốc** | $deltaMB MB | `$deltaHash` |`n" }
          if ($fullPkg) { $auditText += "| `$($fullPkg.Name)` | **Bản cài Full trọn gói** | $fullMB MB | `$fullHash` |`n" }
          if ($setupExe) { $auditText += "| `$($setupExe.Name)` | **Bộ cài Windows Setup** | $setupMB MB | `$setupHash` |`n" }
          
          if (Test-Path "RELEASE_AUDIT.md") {
            $auditLog = Get-Content -Raw -Encoding utf8 "RELEASE_AUDIT.md"
            $auditText += "`n`n<details><summary><b>🔍 Bấm để xem Báo cáo Kiểm toán Mã nguồn Chi tiết (Audit Log)</b></summary>`n`n" + $auditLog + "`n</details>`n"
          }
          
          $auditText | Out-File -FilePath "RELEASE_NOTES.md" -Append -Encoding utf8

      - name: Clean Conflicting Remote Assets
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
            "User-Agent" = "GitHub-Actions-Velopack"
          }
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
            foreach ($rel in $releases) {
              if ($rel.tag_name -eq $tag) {
                Write-Host "Found existing release for $tag (ID: $($rel.id), Draft: $($rel.draft)). Deleting to avoid asset conflicts..."
                Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($rel.id)" -Headers $headers
              }
            }
          } catch {
            Write-Host "No conflicting releases found: $_"
          }

      - name: Upload Packages to GitHub Release
        shell: pwsh
        run: |
          vpk upload github `
            --outputDir "dist\releases" `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --tag "$env:TAG" `
            --merge `
            --publish

      - name: Update Release Notes
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
            "User-Agent" = "GitHub-Actions-ReleaseNotes"
          }
          if (Test-Path "RELEASE_NOTES.md") {
            $notes = Get-Content -Raw -Encoding utf8 "RELEASE_NOTES.md"
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers
              if ($rel -and $rel.id) {
                $body = @{ body = $notes } | ConvertTo-Json
                Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($rel.id)" -Headers $headers -Body $body -ContentType "application/json; charset=utf-8"
                Write-Host "Updated release notes for $tag successfully!"
              }
            } catch {
              Write-Host "Could not update release notes: $_"
            }
          }
